[project]
name = "demandml"
version = "0.1.0"
description = "SKU-level demand forecasting and order planning"
requires-python = ">=3.12"
dependencies = [
    # data wrangling / out-of-core
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=18",
    "pandas>=2.2",
    "numpy>=2.0",
    # modelling
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "statsmodels>=0.14",
    "optuna>=4.0",
    # analysis / notebooks
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # utils
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "holidays>=0.60",
]

[project.scripts]
demandml = "demandml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demandml"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
